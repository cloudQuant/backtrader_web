<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">AI for Investor 系统架构图</title>
  <desc id="desc">AI for Investor 从投资需求、AI 投研、数据回测、模拟交易到实盘审核的分层系统架构。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 800 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 800 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 500 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .whiteTitle { font: 800 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .whiteText { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dbeafe; }
      .panel { fill: #ffffff; stroke: #dbe5f0; stroke-width: 1.2; rx: 18; filter: url(#shadow); }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 14; }
      .boxBlue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.2; rx: 14; }
      .boxGreen { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.2; rx: 14; }
      .boxAmber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.2; rx: 14; }
      .boxRed { fill: #fff1f2; stroke: #fda4af; stroke-width: 1.2; rx: 14; }
      .boxPurple { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.2; rx: 14; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .lineSoft { fill: none; stroke: #94a3b8; stroke-width: 1.6; marker-end: url(#arrow); }
      .lineBlue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .chip { fill: #f8fafc; stroke: #cbd5e1; rx: 10; }
      .number { font: 800 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1440" height="1040" fill="url(#bg)"/>

  <text x="72" y="64" class="title">AI for Investor 系统架构</text>
  <text x="72" y="96" class="subtitle">以 AI 投研编排为核心，连接数据、回测、策略版本、模拟交易、人工审核与实盘准备，形成可验证、可优化、可审计的投资闭环。</text>

  <rect x="72" y="128" width="1296" height="104" class="panel"/>
  <text x="104" y="162" class="section">核心优势</text>
  <rect x="104" y="178" width="250" height="34" class="chip"/>
  <text x="124" y="201" class="small">想法到策略的自动化闭环</text>
  <rect x="378" y="178" width="250" height="34" class="chip"/>
  <text x="398" y="201" class="small">真实数据、成本与交易约束</text>
  <rect x="652" y="178" width="250" height="34" class="chip"/>
  <text x="672" y="201" class="small">策略版本、指标与审计轨迹</text>
  <rect x="926" y="178" width="250" height="34" class="chip"/>
  <text x="946" y="201" class="small">模拟验证后再人工审核实盘</text>
  <rect x="1200" y="178" width="136" height="34" class="chip"/>
  <text x="1220" y="201" class="small">AI 成本可观测</text>

  <rect x="72" y="272" width="178" height="440" class="panel"/>
  <text x="104" y="310" class="section">用户体验层</text>
  <rect x="104" y="338" width="114" height="48" class="boxBlue"/>
  <text x="126" y="367" class="label">用户/投研</text>
  <rect x="104" y="418" width="114" height="66" class="box"/>
  <text x="124" y="445" class="label">Vue3 前端</text>
  <text x="121" y="466" class="small">TypeScript</text>
  <rect x="104" y="516" width="114" height="156" class="boxGreen"/>
  <text x="127" y="546" class="label">业务入口</text>
  <text x="124" y="576" class="small">AI 投研</text>
  <text x="124" y="600" class="small">知识库</text>
  <text x="124" y="624" class="small">工作区</text>
  <text x="124" y="648" class="small">数据管理</text>

  <rect x="292" y="272" width="180" height="440" class="panel"/>
  <text x="322" y="310" class="section">API 与安全</text>
  <rect x="324" y="356" width="116" height="64" class="boxBlue"/>
  <text x="346" y="384" class="label">FastAPI</text>
  <text x="343" y="404" class="small">API 层</text>
  <rect x="324" y="456" width="116" height="64" class="boxAmber"/>
  <text x="343" y="485" class="label">JWT/RBAC</text>
  <text x="348" y="505" class="small">认证权限</text>
  <rect x="324" y="556" width="116" height="84" class="box"/>
  <text x="349" y="585" class="label">审计日志</text>
  <text x="346" y="608" class="small">请求校验</text>
  <text x="346" y="629" class="small">错误处理</text>

  <rect x="514" y="272" width="290" height="440" class="panel"/>
  <text x="548" y="310" class="section">AI 投研编排核心</text>
  <rect x="548" y="346" width="222" height="88" fill="url(#core)" rx="18" filter="url(#shadow)"/>
  <text x="584" y="382" class="whiteTitle">AI Research Orchestrator</text>
  <text x="591" y="408" class="whiteText">需求解析 · 策略生成 · 审查优化</text>
  <rect x="548" y="466" width="102" height="70" class="boxPurple"/>
  <text x="570" y="495" class="label">AI Chat</text>
  <text x="567" y="516" class="small">对话入口</text>
  <rect x="668" y="466" width="102" height="70" class="boxPurple"/>
  <text x="686" y="495" class="label">Copilot</text>
  <text x="690" y="516" class="small">策略助手</text>
  <rect x="548" y="568" width="102" height="74" class="boxGreen"/>
  <text x="567" y="597" class="label">Prompt</text>
  <text x="570" y="618" class="small">治理模板</text>
  <rect x="668" y="568" width="102" height="74" class="boxGreen"/>
  <text x="696" y="597" class="label">成本</text>
  <text x="690" y="618" class="small">可观测</text>

  <rect x="846" y="272" width="292" height="440" class="panel"/>
  <text x="880" y="310" class="section">领域服务层</text>
  <rect x="880" y="342" width="102" height="74" class="boxBlue"/>
  <text x="899" y="371" class="label">知识库</text>
  <text x="905" y="392" class="small">文档/RAG</text>
  <rect x="1004" y="342" width="102" height="74" class="boxBlue"/>
  <text x="1023" y="371" class="label">策略库</text>
  <text x="1029" y="392" class="small">版本/代码</text>
  <rect x="880" y="448" width="102" height="74" class="boxGreen"/>
  <text x="899" y="477" class="label">回测</text>
  <text x="891" y="498" class="small">Backtrader</text>
  <rect x="1004" y="448" width="102" height="74" class="boxGreen"/>
  <text x="1023" y="477" class="label">指标</text>
  <text x="1020" y="498" class="small">稳健性</text>
  <rect x="880" y="554" width="102" height="74" class="boxAmber"/>
  <text x="899" y="583" class="label">工作区</text>
  <text x="893" y="604" class="small">研究/交易</text>
  <rect x="1004" y="554" width="102" height="74" class="boxAmber"/>
  <text x="1023" y="583" class="label">交易</text>
  <text x="1017" y="604" class="small">模拟/实盘</text>

  <rect x="1180" y="272" width="188" height="440" class="panel"/>
  <text x="1210" y="310" class="section">数据与外部系统</text>
  <rect x="1212" y="342" width="124" height="66" class="box"/>
  <text x="1238" y="370" class="label">业务数据库</text>
  <text x="1227" y="391" class="small">SQLite/PostgreSQL/MySQL</text>
  <rect x="1212" y="444" width="124" height="66" class="boxGreen"/>
  <text x="1234" y="472" class="label">行情数据源</text>
  <text x="1234" y="493" class="small">AkShare / 交易所</text>
  <rect x="1212" y="546" width="124" height="66" class="boxPurple"/>
  <text x="1232" y="574" class="label">模型 API</text>
  <text x="1223" y="595" class="small">OpenAI-compatible</text>
  <rect x="1212" y="648" width="124" height="38" class="boxRed"/>
  <text x="1238" y="672" class="label">券商/网关</text>

  <path d="M 161 386 L 161 418" class="lineSoft"/>
  <path d="M 218 452 L 324 388" class="line"/>
  <path d="M 440 388 L 548 390" class="line"/>
  <path d="M 770 390 L 880 379" class="lineBlue"/>
  <path d="M 770 390 L 880 485" class="lineBlue"/>
  <path d="M 770 390 L 880 591" class="lineBlue"/>
  <path d="M 982 379 L 1212 375" class="dash"/>
  <path d="M 982 485 L 1212 477" class="dash"/>
  <path d="M 770 501 L 1212 579" class="lineSoft"/>
  <path d="M 1106 591 L 1212 667" class="lineSoft"/>
  <path d="M 931 416 L 931 448" class="lineSoft"/>
  <path d="M 1055 416 L 1055 448" class="lineSoft"/>
  <path d="M 931 522 L 931 554" class="lineSoft"/>
  <path d="M 1055 522 L 1055 554" class="lineSoft"/>

  <rect x="72" y="760" width="1296" height="214" class="panel"/>
  <text x="104" y="800" class="section">从想法到投资的主流程</text>

  <g>
    <circle cx="142" cy="868" r="18" fill="#2563eb"/>
    <text x="138" y="873" class="number">1</text>
    <rect x="172" y="836" width="138" height="64" class="boxBlue"/>
    <text x="202" y="863" class="label">投资需求</text>
    <text x="194" y="884" class="small">目标与风险约束</text>
  </g>
  <g>
    <circle cx="342" cy="868" r="18" fill="#2563eb"/>
    <text x="338" y="873" class="number">2</text>
    <rect x="372" y="836" width="138" height="64" class="boxPurple"/>
    <text x="401" y="863" class="label">AI 投研</text>
    <text x="394" y="884" class="small">构思/生成/审查</text>
  </g>
  <g>
    <circle cx="542" cy="868" r="18" fill="#2563eb"/>
    <text x="538" y="873" class="number">3</text>
    <rect x="572" y="836" width="138" height="64" class="boxGreen"/>
    <text x="601" y="863" class="label">回测优化</text>
    <text x="591" y="884" class="small">样本外/稳健性</text>
  </g>
  <g>
    <circle cx="742" cy="868" r="18" fill="#2563eb"/>
    <text x="738" y="873" class="number">4</text>
    <rect x="772" y="836" width="138" height="64" class="boxAmber"/>
    <text x="801" y="863" class="label">模拟交易</text>
    <text x="796" y="884" class="small">订单/成交/持仓</text>
  </g>
  <g>
    <circle cx="942" cy="868" r="18" fill="#2563eb"/>
    <text x="938" y="873" class="number">5</text>
    <rect x="972" y="836" width="138" height="64" class="boxRed"/>
    <text x="1001" y="863" class="label">人工审核</text>
    <text x="991" y="884" class="small">审核包/准入结论</text>
  </g>
  <g>
    <circle cx="1142" cy="868" r="18" fill="#2563eb"/>
    <text x="1138" y="873" class="number">6</text>
    <rect x="1172" y="836" width="138" height="64" class="box"/>
    <text x="1201" y="863" class="label">实盘准备</text>
    <text x="1197" y="884" class="small">风控保护下部署</text>
  </g>

  <path d="M 310 868 L 372 868" class="line"/>
  <path d="M 510 868 L 572 868" class="line"/>
  <path d="M 710 868 L 772 868" class="line"/>
  <path d="M 910 868 L 972 868" class="line"/>
  <path d="M 1110 868 L 1172 868" class="line"/>

  <path d="M 641 836 C 650 792, 745 792, 841 836" class="dash"/>
  <text x="676" y="792" class="tiny">未达标则回到优化</text>
  <path d="M 1041 900 C 980 952, 760 950, 641 900" class="dash"/>
  <text x="767" y="946" class="tiny">审核驳回后继续投研迭代</text>

  <text x="104" y="942" class="tiny">说明：图中实盘阶段表示“实盘交易准备/准入”，真正下单前仍需人工审核、账户授权、风控规则和网关健康检查。</text>
</svg>
