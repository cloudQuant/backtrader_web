[project]
name = "backtrader-web-backend"
version = "0.1.0"
description = "Backtrader Web Backend Service"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Backtrader Web Team"}
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "apscheduler>=3.10.4",
    "pydantic>=2.5.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.1.0",
    "jinja2>=3.1.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "PyJWT[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "loguru>=0.7.2",
    "python-multipart>=0.0.6",
    "PyYAML>=6.0.1",
    "fincore>=0.3.0",
    "mysql-connector-python>=8.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.5.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.10.0",
    "diff-cover>=9.0.0",
    "openapi-spec-validator>=0.7.1",
]
postgres = ["asyncpg>=0.29.0"]
mysql = ["aiomysql>=0.2.0"]
redis = ["redis>=5.0.0"]
backtrader = ["backtrader>=1.9.78.123", "pandas>=2.1.0", "numpy>=1.26.0"]
data = ["akshare>=1.12.0"]
prod = ["gunicorn>=22.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "scripts/legacy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "C4"]
ignore = ["E501", "B008", "B904"]
# B=bugbear, UP=pyupgrade, C4=comprehensions

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "performance: Performance benchmark tests",
    "e2e: End-to-end integration tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.mypy]
# Type checking is opt-in for now. Run locally with `mypy app`.
# Once warnings drop and time allows, tighten step-by-step
# (e.g. enable `disallow_untyped_defs` per package).
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "alembic/",
    "migrations/",
    "tests/",
    "scripts/",
    ".venv.*",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = ["app.api.*", "app.schemas.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages without type hints we don't want noise from.
module = [
    "backtrader.*",
    "akshare.*",
    "fincore.*",
    "loguru.*",
    "slowapi.*",
    "apscheduler.*",
    "passlib.*",
    "jwt.*",
    "monaco_editor.*",
    "yaml.*",
]
ignore_missing_imports = true
