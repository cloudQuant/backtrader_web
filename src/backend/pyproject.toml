[project]
name = "ai-for-investor-backend"
version = "0.1.0"
description = "AI for Investor Backend Service"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "AI for Investor Team"}
]

dependencies = [
    "fastapi>=0.109.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.27.0",
    "apscheduler>=3.10.4",
    "pydantic>=2.5.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.14.2",
    "jinja2>=3.1.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "PyJWT[crypto]>=2.13.0",
    "cryptography>=48.0.1",
    "passlib[bcrypt]>=1.7.4",
    "loguru>=0.7.2",
    "python-multipart>=0.0.31",
    "PyYAML>=6.0.1",
    "fincore>=0.3.0",
    "mysql-connector-python>=8.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.0.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy==1.20.2",
    "diff-cover>=9.0.0",
    "openapi-spec-validator>=0.7.1",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]
postgres = ["asyncpg>=0.29.0"]
mysql = ["aiomysql>=0.2.0"]
redis = ["redis>=5.0.0"]
backtrader = ["backtrader>=1.9.78.123", "pandas>=2.1.0", "numpy>=1.26.0"]
data = ["akshare>=1.12.0"]
ai = ["litellm>=1.40,<2.0"]
prod = ["gunicorn>=22.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "scripts/legacy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "C4", "T201"]
ignore = ["E501", "B008"]
# B=bugbear, UP=pyupgrade, C4=comprehensions

[tool.ruff.lint.per-file-ignores]
# CLI scripts and perf harnesses legitimately use print() for operator output.
"scripts/**" = ["T201"]
"tests/test_performance_baseline.py" = ["T201"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "performance: Performance benchmark tests",
    "e2e: End-to-end integration tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.mypy]
# Type checking is opt-in for now. Run locally with `mypy app`.
# Once warnings drop and time allows, tighten step-by-step
# (e.g. enable `disallow_untyped_defs` per package).
python_version = "3.10"
# pydantic v2 mypy plugin: teaches mypy about model __init__ signatures so
# constructing a model with Field-defaulted args (e.g. ParamSpec) no longer
# reports spurious "missing named argument" errors. Net -146 errors repo-wide.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "alembic/",
    "migrations/",
    "tests/",
    "scripts/",
    ".venv.*",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = ["app.api.*", "app.schemas.*", "app.services.quote.*", "app.utils.*"]
disallow_untyped_defs = true

# Iteration 175 §1: services strict-scope expansion (wave 1).
# Subpackages with zero or near-zero strict-mode errors are enrolled here.
# 176 §A wave-2 (2026-05-30): the remaining 6 service subpackages
# (gateway/akshare/strategy/backtest/live_trading/workspace) reached 0 errors
# in strict mode and are now enrolled below (see
# docs/explanation/REFACTORING_BACKLOG.md §A).
[[tool.mypy.overrides]]
module = [
    "app.services.optimization.*",
    "app.services.log_parser.*",
    "app.services.ai_trading.*",
    "app.services.gateway.*",
    "app.services.akshare.*",
    "app.services.strategy.*",
    "app.services.backtest.*",
    "app.services.live_trading.*",
    "app.services.workspace.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# Third-party packages without type hints we don't want noise from.
module = [
    "backtrader.*",
    "akshare.*",
    "fincore.*",
    "loguru.*",
    "slowapi.*",
    "apscheduler.*",
    "passlib.*",
    "jwt.*",
    "monaco_editor.*",
    "yaml.*",
]
ignore_missing_imports = true
