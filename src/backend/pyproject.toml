[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "performance: Performance benchmark tests",
    "e2e: End-to-end integration tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.mypy]
# Type checking is opt-in for now. Run locally with `mypy app`.
# Once warnings drop and time allows, tighten step-by-step
# (e.g. enable `disallow_untyped_defs` per package).
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "alembic/",
    "migrations/",
    "tests/",
    "scripts/",
    ".venv.*",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = ["app.api.*", "app.schemas.*", "app.services.quote.*", "app.utils.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages without type hints we don't want noise from.
module = [
    "backtrader.*",
    "akshare.*",
    "fincore.*",
    "loguru.*",
    "slowapi.*",
    "apscheduler.*",
    "passlib.*",
    "jwt.*",
    "monaco_editor.*",
    "yaml.*",
]
ignore_missing_imports = true
