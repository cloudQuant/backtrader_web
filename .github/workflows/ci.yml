name: CI - Quality Checks

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ========================================
  # Pre-flight Checks
  # ========================================
  check-generated-artifacts:
    name: Check - No Generated Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for generated artifacts
        run: ./scripts/ci/check-generated-artifacts.sh

  check-doc-links:
    name: Check - Doc Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Validate doc links
        run: python scripts/ci/check_doc_links.py

  check-deps-sync:
    name: Check - Deps Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Validate deps sync
        run: python scripts/ci/check_deps_sync.py

  check-migrations:
    name: Check - Alembic Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Install backend dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify migration chain
        run: python scripts/ci/check_alembic_heads.py

      - name: Test migration on empty database
        working-directory: src/backend
        timeout-minutes: 2
        run: |
          alembic upgrade head

      - name: Check for unmigrated model changes
        working-directory: src/backend
        run: |
          alembic check || echo "::error::ORM models have changes not covered by migrations" && exit 1

      # Iteration 175 §8 — fully-fledged drift detection beyond `alembic check`.
      # Compares ORM Base.metadata against the schema produced by upgrading a
      # fresh SQLite DB to head. Blocking gate.
      - name: ORM ↔ migration drift check (175 §8)
        run: python scripts/ci/check_orm_schema_drift.py

      # Iteration 175 §8.6 — advisory: flag risky migration operations on
      # files added/modified in this PR. Always exits 0; output is captured
      # in job summary.
      - name: Migration safety lint (175 §8.6, advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/ci/check_migration_safety.py

  check-openapi:
    name: Check - OpenAPI Schema
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Install backend dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Export OpenAPI schema
        run: python scripts/ci/export_openapi.py openapi.json

      - name: Validate OpenAPI 3.1 schema
        run: python -c "from openapi_spec_validator import validate; import json; validate(json.load(open('openapi.json'))); print('✓ OpenAPI schema is valid')"

      - name: Check API compatibility
        if: github.event_name == 'pull_request'
        run: |
          # Fetch base branch schema for comparison
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:scripts/ci/export_openapi.py > /tmp/export_base.py 2>/dev/null || true
          if [ -f /tmp/export_base.py ]; then
            python /tmp/export_base.py openapi-base.json 2>/dev/null || true
            if [ -f openapi-base.json ]; then
              python scripts/ci/check_api_compat.py openapi.json openapi-base.json
            else
              echo "⚠ Could not export base branch schema, skipping compatibility check"
            fi
          else
            echo "⚠ Base branch has no export script, skipping compatibility check"
          fi

      - name: Check OpenAPI example values
        run: python scripts/ci/check_openapi_examples.py openapi.json

      - name: Archive OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.json
          retention-days: 7

  # ========================================
  # Backend Quality Checks
  # ========================================
  backend-lint:
    name: Backend - Lint & Type Check
    runs-on: ubuntu-latest
    needs: check-generated-artifacts
    defaults:
      run:
        working-directory: src/backend
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Cache backend virtualenv
        uses: actions/cache@v4
        id: cache-backend-venv-lint
        with:
          path: src/backend/.venv
          key: venv-lint-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('src/backend/pyproject.toml', 'config/requirements-dev.lock') }}
          restore-keys: |
            venv-lint-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        if: steps.cache-backend-venv-lint.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # mypy pinned to match the 177 §E ratchet baseline
          # (scripts/ci/mypy_app_baseline.json). Bumping mypy requires
          # regenerating that baseline via `mypy_ratchet.py --update`.
          .venv/bin/pip install ruff pytest pytest-asyncio httpx "mypy==1.20.2"
          .venv/bin/pip install -e ".[backtrader]"

      - name: Activate virtualenv
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Run Ruff linter
        run: |
          ruff check . --output-format=github

      - name: Check Ruff formatting
        run: |
          ruff format --check .

      - name: Check import sorting
        run: |
          ruff check . --select I

      - name: Smoke check backend entrypoint
        run: |
          python -m py_compile app/main.py
          python -c "from app.main import app; print(app.title)"

      - name: Run Mypy type check (repo-wide ratchet, 177 §E)
        # The whole-`app` type check carries ~1055 legacy errors that predate
        # CI ever running on `dev` (the F1 root cause). Rather than block on a
        # green-field 0 (unrealistic) or silently ignore regressions, this
        # ratchet fails only when the count *increases*. Per-package strict
        # gates (backend-mypy-* jobs below) still enforce 0 on enrolled scopes.
        # Lower the baseline via `python scripts/ci/mypy_ratchet.py --update`
        # whenever the count drops. See docs/iterations/迭代177-*/CLOSURE.md §E.
        run: |
          python ../../scripts/ci/mypy_ratchet.py

  backend-mypy-ratchet:
    name: Backend - Mypy Ratchet (utils + schemas)
    runs-on: ubuntu-latest
    needs: check-generated-artifacts
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy ratchet scopes
        run: |
          mypy app/utils app/schemas

  backend-mypy-quote:
    name: Backend - Mypy Ratchet (quote)
    runs-on: ubuntu-latest
    needs: check-generated-artifacts
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy quote ratchet scope
        run: |
          mypy app/services/quote

  backend-mypy-api-subset:
    name: Backend - Mypy Ratchet (api subset)
    runs-on: ubuntu-latest
    needs: check-generated-artifacts
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy api subset ratchet scope
        run: |
          mypy app/api/status.py app/api/metrics.py app/api/docs.py app/api/auth.py

  backend-mypy-services:
    name: Backend - Mypy Ratchet (services subset, 175 §1)
    runs-on: ubuntu-latest
    needs: check-generated-artifacts
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Iteration 175 §1 — strict-mode mypy expanded to services subpackages.
      # Wave 1 (175): optimization / log_parser / ai_trading (all currently green).
      # Wave 2 (176 candidates): strategy / backtest / gateway / akshare /
      #   live_trading / workspace — see docs/iterations/迭代175-质量加固与可观测性纵深/PROGRESS.md
      #   §1 for the per-subpackage error baselines.
      - name: Run mypy services strict scope
        run: |
          mypy app/services/optimization app/services/log_parser app/services/ai_trading

  backend-test:
    name: Backend - Unit Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-mypy-ratchet, backend-mypy-quote, backend-mypy-api-subset, backend-mypy-services]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Cache backend virtualenv
        uses: actions/cache@v4
        id: cache-backend-venv-test
        with:
          path: src/backend/.venv
          key: venv-test-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/backend/pyproject.toml', 'config/requirements-dev.lock') }}
          restore-keys: |
            venv-test-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        if: steps.cache-backend-venv-test.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev,backtrader,data,redis]"
          .venv/bin/pip install pytest-cov pytest-xdist

      - name: Activate virtualenv
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Check lockfile sync
        working-directory: .
        run: |
          python scripts/ci/check_lockfile_sync.py config/requirements-dev.lock

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-config=.coveragerc --cov-report=xml --cov-report=term --cov-report=html --cov-fail-under=70 -n auto -v

      - name: Check diff coverage
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml --compare-branch=origin/master --fail-under=60

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: src/backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Archive coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: src/backend/htmlcov/
          retention-days: 7

  backend-security:
    name: Backend - Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install --no-cache-dir bandit pip-audit
          .venv/bin/pip install --no-cache-dir -e .

      - name: Run Bandit security linter
        run: |
          bash ../../scripts/ci/bandit_gate.sh app

      # Iteration 177 §C — replace the deprecated `safety check` CLI (Safety
      # 3.x removed `check` in favour of an account-gated `safety scan`) with
      # pip-audit (PyPA, OSV-backed, no account required).
      #
      # Iteration 178 §C — flipped to BLOCKING. The baseline was taken against
      # the pinned locks via OSV (see docs/iterations/迭代178-安全纵深收口与质量债治理/
      # pip-audit-baseline.md): the only finding was starlette 1.0.0
      # (CVE-2026-48710 "BadHost"), bumped to 1.0.1 in the lock files. The
      # baseline is now clean, so a new vulnerability fails the build.
      #
      # Audits the pinned production lock (the deployable dependency set) so the
      # result is deterministic and matches what ships in the image.
      - name: Audit Python dependencies (pip-audit, blocking)
        run: |
          pip-audit \
            --requirement ../../config/requirements-prod.lock \
            --no-deps \
            --desc \
            --format json \
            --output pip-audit-report.json
          pip-audit \
            --requirement ../../config/requirements-prod.lock \
            --no-deps \
            --desc

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-reports
          path: |
            src/backend/bandit-report.json
            src/backend/pip-audit-report.json

  # ========================================
  # Secret Scanning (iteration 177 §D)
  # ========================================
  secret-scan:
    name: Security - Secret Scan (177 §D)
    runs-on: ubuntu-latest
    needs: check-generated-artifacts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the scan can catch secrets in any commit, not just
          # the current tree.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Iteration 177 §D — ADVISORY by default; gated blocking flip (178 §A).
      #
      # The full-history scan currently reports ~114 findings, the bulk of which
      # are REAL credentials that were committed to runtime files before they
      # were untracked (manual_gateways/*, sync_config.json, ...). See
      # docs/iterations/迭代177-质量门禁修复与安全纵深/CLOSURE.md.
      #
      # Those leaks live in git *history*, so this scan keeps flagging them until
      # two ops actions land (see docs/iterations/迭代178-安全纵深收口与质量债治理/
      # ROTATION_RUNBOOK.md):
      #   1. Rotate every exposed key/password at the provider.
      #   2. Purge history (scripts/ops/purge_secret_history.sh) + force-push,
      #      coordinated with all collaborators.
      #
      # Once history is clean, set the repo/org variable
      # SECRET_SCAN_HISTORY_BLOCKING=true to flip this step to a hard fail —
      # no code change or redeploy needed. Until then it stays advisory so the
      # known historical leaks don't false-fail every build.
      #
      # The allowlist in .gitleaks.toml covers the project's intentional
      # placeholders so the gate stays signal-rich.
      - name: Scan full history for secrets (advisory unless SECRET_SCAN_HISTORY_BLOCKING=true)
        env:
          HISTORY_BLOCKING: ${{ vars.SECRET_SCAN_HISTORY_BLOCKING }}
        run: |
          if gitleaks detect \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --redact \
            --no-banner \
            --exit-code 1; then
            echo "gitleaks full-history scan: no findings."
          else
            if [ "${HISTORY_BLOCKING}" = "true" ]; then
              echo "::error::gitleaks reported secrets in history and SECRET_SCAN_HISTORY_BLOCKING=true (blocking)."
              exit 1
            fi
            echo "::warning::gitleaks reported potential secrets (advisory; see gitleaks-report.sarif artifact). Set SECRET_SCAN_HISTORY_BLOCKING=true after the history purge to make this blocking."
          fi

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 7

      # BLOCKING — only the commits introduced by this PR are scanned, so the
      # historical leaks above don't false-fail it. This makes the gate have
      # teeth *now*: any NEW secret in a PR fails the build immediately, while
      # the history purge (P0 ops follow-up) is still pending.
      - name: Scan PR commits for newly introduced secrets (blocking)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --report-format sarif \
            --report-path gitleaks-pr-report.sarif \
            --redact \
            --no-banner \
            --exit-code 1

      - name: Upload gitleaks PR report
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: gitleaks-pr-report
          path: gitleaks-pr-report.sarif
          retention-days: 7

  # ========================================
  # Frontend Quality Checks
  # ========================================
  frontend-lint:
    name: Frontend - Lint & Type Check
    runs-on: ubuntu-latest
    needs: check-generated-artifacts
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies (high/critical)
        run: npm audit --audit-level=high

      - name: Verify ESLint version
        run: npx eslint --version

      - name: Run ESLint
        run: npx eslint .

      - name: TypeScript type check
        run: npx vue-tsc --noEmit --skipLibCheck

      - name: 'Iteration 175 §4.7 — PR template i18n manifest (blocking, diff-aware since 179 §D)'
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only require the i18n manifest when locale files actually changed.
          # 179 §D made check_pr_template.py diff-aware via CHANGED_FILES, so
          # this is now blocking without nagging PRs that touch no translations.
          git fetch origin "$BASE_SHA" --depth=1 2>/dev/null || true
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          export CHANGED_FILES
          python3 scripts/ci/check_pr_template.py

  frontend-test:
    name: Frontend - Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test -- --run --coverage

      - name: 覆盖率核心阈值汇总 (175 §2.5)
        if: always()
        run: node ../../scripts/dev/coverage_core_summary.mjs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: src/frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: src/frontend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend - Production Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check bundle size
        run: bash ../../scripts/ci/check_bundle_size.sh dist

      - name: Compare bundle size with target branch
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Iteration 175 §7.6 — > 10% growth blocks unless override label or
          # `<!-- bundle-size-override: <reason> -->` HTML comment is present.

          # Try to get base branch entry chunk size from last successful build artifact
          echo "Fetching base branch build artifact..."

          ARTIFACT_URL=$(curl -s -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=frontend-dist&per_page=5" \
            | node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
              const artifacts = (data.artifacts || []).filter(a => !a.expired);
              if (artifacts.length > 0) {
                console.log(artifacts[0].archive_download_url);
              }
            " 2>/dev/null || echo "")

          BASE_BYTES=""
          if [ -n "$ARTIFACT_URL" ]; then
            mkdir -p /tmp/base-dist
            curl -s -L -H "Authorization: token ${{ github.token }}" "$ARTIFACT_URL" -o /tmp/base-dist.zip || true
            unzip -q -o /tmp/base-dist.zip -d /tmp/base-dist 2>/dev/null || true
            BASE_ENTRY=$(find /tmp/base-dist -name "index-*.js" -type f 2>/dev/null | head -1 || true)
            if [ -n "$BASE_ENTRY" ]; then
              BASE_BYTES=$(gzip -c -9 "$BASE_ENTRY" | wc -c | tr -d ' ')
            fi
          fi

          # Delegate to compare_bundle_size.sh which handles override logic and
          # GITHUB_STEP_SUMMARY emission. Empty BASE_BYTES → ratchet skipped.
          bash ../../scripts/ci/compare_bundle_size.sh dist "${BASE_BYTES:-}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist/
          retention-days: 7

  # ========================================
  # Frontend Performance Audit
  # ========================================
  lighthouse-ci:
    name: Frontend - Lighthouse CI
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI audits
        id: lhci
        run: |
          lhci autorun --config=lighthouserc.js || LHCI_EXIT=$?

          # Parse results for annotations
          if [ -d "./lighthouse-reports" ]; then
            for manifest in ./lighthouse-reports/manifest.json; do
              if [ -f "$manifest" ]; then
                # Check performance scores
                node -e "
                  const fs = require('fs');
                  const manifest = JSON.parse(fs.readFileSync('$manifest', 'utf8'));
                  let accessibilityFailed = false;
                  for (const entry of manifest) {
                    const result = JSON.parse(fs.readFileSync(entry.jsonPath, 'utf8'));
                    const perfScore = Math.round((result.categories.performance?.score || 0) * 100);
                    const a11yScore = Math.round((result.categories.accessibility?.score || 0) * 100);
                    const url = result.finalUrl || entry.url;
                    console.log('URL: ' + url + ' | Performance: ' + perfScore + ' | Accessibility: ' + a11yScore);
                    if (perfScore < 60) {
                      console.log('::warning::Lighthouse Performance score ' + perfScore + ' < 60 for ' + url);
                    }
                    // Iteration 175 §3.5 — accessibility threshold ratcheted 80 -> 90.
                    if (a11yScore < 90) {
                      console.log('::error::Lighthouse Accessibility score ' + a11yScore + ' < 90 for ' + url);
                      accessibilityFailed = true;
                    }
                  }
                  if (accessibilityFailed) {
                    process.exit(1);
                  }
                "
              fi
            done
          fi

      - name: Archive Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: ./lighthouse-reports/
          retention-days: 7

  # ========================================
  # Iteration 175 — A11y / i18n / E2E smoke / monorepo
  # ========================================
  frontend-a11y:
    name: Frontend - A11y (175 §3)
    runs-on: ubuntu-latest
    needs: [frontend-build]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend (preview will serve dist)
        run: npm run build

      - name: Start vite preview
        run: |
          nohup npx vite preview --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 24); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4173/ | grep -qE "^(200|304)$"; then
              echo "vite preview up"
              break
            fi
            sleep 5
          done

      - name: Run a11y suite
        env:
          BASE_URL: http://localhost:4173
        run: npx playwright test --config=playwright.a11y.config.ts

      - name: Upload a11y trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-traces
          path: src/frontend/test-results/
          retention-days: 7

  frontend-i18n:
    name: Frontend - i18n (175 §4)
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Set up Python (for check_i18n_coverage.py)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Locale parity check (blocking)
        run: python scripts/dev/check_i18n_coverage.py --check-parity

      # Iteration 176 §C — CJK extraction reached 0 violations on 2026-05-29
      # (commit 487d7659). The CJK-only gate is now blocking; future PRs that
      # introduce hard-coded CJK literals (in <template> text, Element Plus
      # label/placeholder props, or ElMessage* call positions) will fail CI.
      - name: i18n CJK strict scan (blocking)
        run: python scripts/dev/check_i18n_coverage.py --strict --cjk-only

      # Iteration 181 §E — full strict scan is baseline-gated instead of advisory.
      # The remaining findings are mostly English over-reach, but new findings
      # must not increase beyond scripts/dev/check_i18n_coverage_baseline.json.
      - name: Strict scan full (baseline-gated; CJK + English)
        run: python scripts/dev/check_i18n_coverage.py --strict --baseline-file scripts/dev/check_i18n_coverage_baseline.json --max-output 50

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Start vite preview
        working-directory: src/frontend
        run: |
          nohup npx vite preview --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 24); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4173/ | grep -qE "^(200|304)$"; then break; fi
            sleep 5
          done

      - name: Run en-US no-CJK suite
        working-directory: src/frontend
        env:
          BASE_URL: http://localhost:4173
        run: npx playwright test --config=playwright.i18n.config.ts

  frontend-e2e-smoke:
    name: Frontend - E2E Smoke (175 §6)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      SECRET_KEY: test-secret-key-for-ci-32-characters-minimum
      JWT_SECRET_KEY: test-jwt-secret-key-for-ci-32-characters-minimum

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run alembic migrations
        working-directory: src/backend
        run: alembic upgrade head

      - name: Seed smoke dataset (175 §6.5)
        run: python scripts/dev/seed_e2e_smoke.py

      - name: Start backend (uvicorn)
        working-directory: src/backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &

      - name: Build & serve frontend
        working-directory: src/frontend
        run: |
          npm run build
          nohup npx vite preview --port 4173 > /tmp/vite.log 2>&1 &

      - name: Wait for /api/v1/health (60s budget)
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "backend healthy"
              break
            fi
            echo "waiting for backend ($i/12, code=$CODE)"
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::backend /api/v1/health did not return 200 within 60s"
            echo "--- last 50 lines of uvicorn.log ---"
            tail -50 /tmp/uvicorn.log || true
            exit 1
          fi

      - name: Run smoke suite
        working-directory: src/frontend
        env:
          BASE_URL: http://localhost:4173
        run: npx playwright test e2e/smoke-175/ --reporter=list

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-traces
          path: |
            src/frontend/test-results/
            src/frontend/e2e-results/
          retention-days: 7

  monorepo-check:
    name: Monorepo - check_all.sh (175 §9, advisory)
    runs-on: ubuntu-latest
    needs: [check-generated-artifacts]
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Run check_all.sh (advisory)
        run: bash scripts/dev/check_all.sh
        continue-on-error: true

  # ========================================
  # Integration Tests
  # ========================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      SECRET_KEY: test-secret-key-for-ci-32-characters-minimum
      JWT_SECRET_KEY: test-jwt-secret-key-for-ci-32-characters-minimum

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            src/backend/pyproject.toml
            config/requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install --no-cache-dir -e ".[dev,postgres,backtrader,data,redis]"

      - name: Run integration tests
        run: |
          pytest tests/ -v -m integration --tb=short

      - name: Validate health check endpoint
        run: |
          # Start the backend server in background
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!

          # Wait for server to be ready (max 30s)
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Server failed to start within 30 seconds"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # Send health check request and measure response time
          START_TIME=$(date +%s%N)
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" http://127.0.0.1:8000/api/v1/health)
          END_TIME=$(date +%s%N)

          # Parse response
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)
          RESPONSE_TIME_MS=$(( (END_TIME - START_TIME) / 1000000 ))

          echo "Response status: $HTTP_STATUS"
          echo "Response body: $HTTP_BODY"
          echo "Response time: ${RESPONSE_TIME_MS}ms"

          # Verify HTTP 200 status
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Health check returned status $HTTP_STATUS, expected 200"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Verify valid JSON format
          if ! echo "$HTTP_BODY" | python -m json.tool > /dev/null 2>&1; then
            echo "::error::Health check response is not valid JSON: $HTTP_BODY"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Verify required fields exist and have correct types
          python -c "
          import json, sys
          data = json.loads('''$HTTP_BODY''')
          errors = []
          # Check 'status' field
          if 'status' not in data:
              errors.append('Missing field: status')
          elif data['status'] not in ('healthy', 'unhealthy'):
              errors.append(f'Invalid status value: {data[\"status\"]}')
          # Check 'version' field
          if 'version' not in data:
              errors.append('Missing field: version')
          elif not isinstance(data['version'], str):
              errors.append(f'version must be a string, got {type(data[\"version\"]).__name__}')
          # Check 'database' field
          if 'database' not in data:
              errors.append('Missing field: database')
          elif data['database'] not in ('healthy', 'unhealthy'):
              errors.append(f'Invalid database value: {data[\"database\"]}')
          # Check 'uptime' field
          if 'uptime' not in data:
              errors.append('Missing field: uptime')
          elif not isinstance(data['uptime'], (int, float)):
              errors.append(f'uptime must be a number, got {type(data[\"uptime\"]).__name__}')
          elif data['uptime'] < 0:
              errors.append(f'uptime must be >= 0, got {data[\"uptime\"]}')
          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print('✓ All required fields present and valid')
          "

          # Verify response time < 2000ms
          if [ "$RESPONSE_TIME_MS" -gt 2000 ]; then
            echo "::error::Health check response time ${RESPONSE_TIME_MS}ms exceeds 2000ms limit"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "✓ Health check validation passed (status=$HTTP_STATUS, time=${RESPONSE_TIME_MS}ms)"

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true

  # ========================================
  # Summary Job
  # ========================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [check-generated-artifacts, check-doc-links, check-deps-sync, check-migrations, check-openapi, backend-lint, backend-mypy-ratchet, backend-mypy-quote, backend-mypy-api-subset, backend-mypy-services, backend-test, backend-security, secret-scan, frontend-lint, frontend-test, frontend-build, lighthouse-ci, frontend-a11y, frontend-i18n, frontend-e2e-smoke, monorepo-check, integration-test]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Collect job durations and cache status
        uses: actions/github-script@v7
        id: ci-metrics
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            let summary = '### Job Execution Times\n\n';
            summary += '| Job | Duration | Status |\n';
            summary += '|-----|----------|--------|\n';

            for (const job of jobs) {
              if (job.name === 'CI Summary') continue;
              const start = new Date(job.started_at);
              const end = job.completed_at ? new Date(job.completed_at) : new Date();
              const durationSec = Math.round((end - start) / 1000);
              const minutes = Math.floor(durationSec / 60);
              const seconds = durationSec % 60;
              const durationStr = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;
              const statusEmoji = job.conclusion === 'success' ? '✅' : job.conclusion === 'failure' ? '❌' : '⏭️';
              summary += `| ${job.name} | ${durationStr} | ${statusEmoji} ${job.conclusion || 'running'} |\n`;
            }

            // Check cache usage from job steps
            summary += '\n### Cache Status\n\n';
            summary += '| Cache | Status |\n';
            summary += '|-------|--------|\n';

            for (const job of jobs) {
              if (!job.steps) continue;
              for (const step of job.steps) {
                if (step.name && step.name.toLowerCase().includes('cache')) {
                  const cacheStatus = step.conclusion === 'success' ? '✅ HIT/Restored' : '⚠️ MISS';
                  summary += `| ${job.name} → ${step.name} | ${cacheStatus} |\n`;
                }
              }
            }

            core.setOutput('summary', summary);
            return summary;

      - name: Check all jobs status
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Blocker Jobs (must pass)" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Check Generated Artifacts | ${{ needs.check-generated-artifacts.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Check Doc Links | ${{ needs.check-doc-links.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Check Deps Sync | ${{ needs.check-deps-sync.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Check Migrations | ${{ needs.check-migrations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Check OpenAPI | ${{ needs.check-openapi.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Lint | ${{ needs.backend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Mypy Ratchet | ${{ needs.backend-mypy-ratchet.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Mypy Quote | ${{ needs.backend-mypy-quote.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Mypy API Subset | ${{ needs.backend-mypy-api-subset.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Mypy Services (175) | ${{ needs.backend-mypy-services.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Test | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Security | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.secret-scan.result }}" = "failure" ]; then
            echo "| Secret Scan (177, advisory) | ⚠️ ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Secret Scan (177, advisory) | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Test | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse CI | ${{ needs.lighthouse-ci.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend A11y (175) | ${{ needs.frontend-a11y.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend i18n (175) | ${{ needs.frontend-i18n.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend E2E Smoke (175) | ${{ needs.frontend-e2e-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.monorepo-check.result }}" = "failure" ]; then
            echo "| Monorepo Check (advisory) | ⚠️ ${{ needs.monorepo-check.result }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Monorepo Check (advisory) | ${{ needs.monorepo-check.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Integration Test | ${{ needs.integration-test.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Output cache and timing metrics
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ${{ steps.ci-metrics.outputs.summary }}
          EOF

      - name: Fail if any blocker job failed
        if: |
          needs.check-generated-artifacts.result == 'failure' ||
          needs.check-doc-links.result == 'failure' ||
          needs.check-deps-sync.result == 'failure' ||
          needs.check-migrations.result == 'failure' ||
          needs.check-openapi.result == 'failure' ||
          needs.backend-lint.result == 'failure' ||
          needs.backend-mypy-ratchet.result == 'failure' ||
          needs.backend-mypy-quote.result == 'failure' ||
          needs.backend-mypy-api-subset.result == 'failure' ||
          needs.backend-mypy-services.result == 'failure' ||
          needs.backend-test.result == 'failure' ||
          needs.backend-security.result == 'failure' ||
          needs.frontend-lint.result == 'failure' ||
          needs.frontend-test.result == 'failure' ||
          needs.frontend-build.result == 'failure' ||
          needs.lighthouse-ci.result == 'failure' ||
          needs.frontend-a11y.result == 'failure' ||
          needs.frontend-i18n.result == 'failure' ||
          needs.frontend-e2e-smoke.result == 'failure' ||
          needs.integration-test.result == 'failure'
        run: exit 1
