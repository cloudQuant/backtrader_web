name: PR Governance (Bootstrap)

# This read-only bootstrap remains inactive until the equivalent workflow and
# its trusted governance implementation are promoted to the default branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# This skeleton deliberately has no actions. Task 4 will add the trusted-base
# governance check after bootstrap.
jobs:
  governance-bootstrap:
    name: Governance bootstrap pending default-branch promotion
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.number > 0 }}
    steps:
      - name: Report bootstrap status
        run: echo "Read-only governance bootstrap; awaiting default-branch promotion."
