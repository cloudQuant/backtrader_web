name: PR - Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

# PR code is checked only with the read-only token GitHub provides to
# pull_request workflows. Fork PRs therefore receive neither write authority
# nor repository secrets.
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ] || [ "$PR_BODY" = "null" ]; then
            echo "::warning::PR description is empty. Please provide a description."
          fi

      - name: Check for linked issues
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$PR_BODY" | grep -qE '(#[0-9]+|Closes|Fixes|Resolves)'; then
            echo "::notice::No linked issues found. Consider linking related issues."
          fi

  size-check:
    name: Check PR Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Calculate changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          STATS=$(git diff --shortstat "$BASE_SHA...$HEAD_SHA")
          ADDED=$(printf '%s' "$STATS" | sed -n 's/.*\([0-9][0-9]*\) insertion.*/\1/p')
          DELETED=$(printf '%s' "$STATS" | sed -n 's/.*\([0-9][0-9]*\) deletion.*/\1/p')
          ADDED=${ADDED:-0}
          DELETED=${DELETED:-0}
          TOTAL=$((ADDED + DELETED))
          echo "Lines added: $ADDED"
          echo "Lines deleted: $DELETED"
          echo "Total changes: $TOTAL"
          if [ "$TOTAL" -gt 2000 ]; then
            echo "::warning::Large PR detected ($TOTAL lines). Consider splitting into smaller PRs."
          fi

      - name: Count changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | wc -l | tr -d ' ')
          echo "Changed files: $FILES"
          if [ "$FILES" -gt 50 ]; then
            echo "::warning::Many files changed ($FILES). Consider splitting into smaller PRs."
          fi

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [backend-imports, frontend-build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Backend imports check
        if: matrix.check == 'backend-imports'
        working-directory: src/backend
        run: |
          python -m pip install -e ".[dev,backtrader]" || pip install -e .
          python -c "
          import app.main
          import app.api.router
          import app.db.database
          print('All critical imports successful!')
          "

      - name: Frontend build check
        if: matrix.check == 'frontend-build'
        working-directory: src/frontend
        run: |
          npm ci
          npm run build
