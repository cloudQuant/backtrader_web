name: Preview Build Artifact

on:
  pull_request:
    branches: [master, dev]
    paths:
      - 'src/frontend/**'
      - 'src/backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-build:
    name: Build non-hosted preview artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

      - name: Record non-hosted artifact scope
        shell: bash
        run: |
          cat > preview-build-metadata.json << EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "scope": "non-hosted preview build artifact",
            "hosting": "not configured"
          }
          EOF
          {
            echo "## Preview Build Artifact"
            echo "This is a non-hosted preview artifact. No environment was deployed and no URL is provided."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-${{ github.run_id }}
          path: |
            src/frontend/dist/
            preview-build-metadata.json
          retention-days: 7
