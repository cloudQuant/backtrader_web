name: Nightly - Comprehensive Tests

on:
  schedule:
    # Run at 2 AM UTC (10 AM Beijing)
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ========================================
  # Read-only GitHub-to-Gitee mirror evidence
  # ========================================
  remote-sync-evidence:
    name: Remote Sync - Read-only Evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout trusted checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record remote head comparison
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/check_remote_sync.py \
            --source https://github.com/cloudQuant/backtrader_web.git \
            --mirror https://gitee.com/yunjinqi/backtrader_web.git \
            --branches master dev \
            --exceptions .github/governance/remote-sync-exceptions.json \
            --output remote-sync-evidence.json | tee remote-sync-summary.txt

      - name: Upload remote-sync evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-remote-sync-evidence
          path: |
            remote-sync-evidence.json
            remote-sync-summary.txt
          if-no-files-found: warn
          retention-days: 30

  # ========================================
  # Full Test Suite
  # ========================================
  backend-full-tests:
    name: Backend - Full Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,redis,backtrader,data]"

      - name: Run all tests with detailed coverage
        run: |
          pip install pytest-cov pytest-xdist
          # Performance assertions run in the dedicated performance job below;
          # they are inherently sensitive to shared-runner load.
          pytest -n auto -m "not performance" --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing -v --tb=short

      - name: Generate coverage badge
        run: |
          pip install coverage-badge
          coverage-badge -o coverage.svg -f

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: nightly-backend-coverage
          path: |
            src/backend/htmlcov/
            src/backend/coverage.xml
            src/backend/coverage.svg
          retention-days: 30

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: src/backend/coverage.xml
          flags: backend-nightly
          name: nightly-backend
          fail_ci_if_error: false

  frontend-full-tests:
    name: Frontend - Full Test Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test -- --run --coverage --reporter=verbose

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: nightly-frontend-coverage
          path: src/frontend/coverage/
          retention-days: 30

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: src/frontend/coverage/coverage-final.json
          flags: frontend-nightly
          name: nightly-frontend
          fail_ci_if_error: false

  # ========================================
  # E2E Full Browser Tests
  # ========================================
  e2e-full-tests:
    name: E2E - All Browsers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backtrader]"

      - name: Start services
        env:
          SECRET_KEY: e2e-secret-key-with-sufficient-length-123456
          JWT_SECRET_KEY: e2e-jwt-secret-key-with-sufficient-length-654321
          DATABASE_URL: sqlite+aiosqlite:///./backtrader_e2e.db
          DB_AUTO_CREATE_SCHEMA: "true"
          DB_AUTO_CREATE_DEFAULT_ADMIN: "true"
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: Admin12345678
          ADMIN_EMAIL: admin@example.com
          RATE_LIMIT_REGISTER: "100/hour"
          RATE_LIMIT_LOGIN: "500/minute"
          RATE_LIMIT_AUTH_ME: "500/minute"
        run: |
          # Start backend
          cd src/backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          cd ../..

          # Wait for backend
          backend_ready=false
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend ready"
              backend_ready=true
              break
            fi
            sleep 2
          done
          if [ "$backend_ready" != true ]; then
            echo "Backend did not become ready"
            exit 1
          fi

          # Start frontend
          cd src/frontend
          npm run dev -- --host 127.0.0.1 &
          cd ../..

          # Wait for frontend
          frontend_ready=false
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000 > /dev/null; then
              echo "Frontend ready"
              frontend_ready=true
              break
            fi
            sleep 2
          done
          if [ "$frontend_ready" != true ]; then
            echo "Frontend did not become ready"
            exit 1
          fi

      - name: Run all E2E tests
        working-directory: src/frontend
        env:
          BASE_URL: http://127.0.0.1:3000
          CI: true
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: Admin12345678
          E2E_SETUP_BROWSER: chromium
        run: npx playwright test

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-reports
          path: src/frontend/e2e-results/
          retention-days: 30

  # ========================================
  # Performance Tests
  # ========================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backtrader]"
          pip install locust

      - name: Run API performance test
        run: |
          # Basic API response time test
          python -c "
          import time
          import httpx

          # Start the app in a subprocess for testing
          import subprocess
          import asyncio

          from app.main import app
          from uvicorn import Config, Server

          async def run_test():
              config = Config(app=app, host='127.0.0.1', port=8001, log_level='error')
              server = Server(config)

              import threading
              t = threading.Thread(target=server.run)
              t.daemon = True
              t.start()
              await asyncio.sleep(2)

              # Test endpoints
              client = httpx.AsyncClient(base_url='http://127.0.0.1:8001', timeout=10.0)

              start = time.time()
              response = await client.get('/health')
              health_time = (time.time() - start) * 1000

              start = time.time()
              response = await client.get('/')
              root_time = (time.time() - start) * 1000

              await client.aclose()

              print(f'Health check: {health_time:.2f}ms')
              print(f'Root endpoint: {root_time:.2f}ms')

              if health_time > 500:
                  print('::warning::Health check too slow (>500ms)')
              if root_time > 500:
                  print('::warning::Root endpoint too slow (>500ms)')

          asyncio.run(run_test())
          "

  # ========================================
  # Dependency Audit & Vulnerability Scanning
  # ========================================
  dependency-audit:
    name: Dependency Audit & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Backend - Install dependencies and run pip-audit
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backtrader,data,redis]"
          pip install pip-audit
          pip-audit --desc --format json --output pip-audit-report.json 2>&1 || true
          pip-audit --desc 2>&1 || true

      - name: Frontend - Install dependencies and run npm audit
        working-directory: src/frontend
        run: |
          npm ci
          npm audit --json > npm-audit-report.json 2>&1 || true
          npm audit 2>&1 || true

      - name: Check for high/critical vulnerabilities and create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'SCRIPT'
          import json
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone

          findings = []

          # --- Parse pip-audit results ---
          pip_report_path = "src/backend/pip-audit-report.json"
          try:
              with open(pip_report_path) as f:
                  pip_data = json.load(f)
              # pip-audit JSON format: {"dependencies": [...], "fixes": [...]}
              # or list of vulnerability objects
              deps = pip_data if isinstance(pip_data, list) else pip_data.get("dependencies", [])
              for dep in deps:
                  vulns = dep.get("vulns", [])
                  for vuln in vulns:
                      vuln_id = vuln.get("id", "UNKNOWN")
                      fix_versions = vuln.get("fix_versions", [])
                      fix_str = ", ".join(fix_versions) if fix_versions else "No fix available"
                      findings.append({
                          "ecosystem": "pip",
                          "package": dep.get("name", "unknown"),
                          "version": dep.get("version", "unknown"),
                          "vuln_id": vuln_id,
                          "severity": "high",  # pip-audit doesn't always provide severity
                          "fix": fix_str,
                      })
          except (FileNotFoundError, json.JSONDecodeError) as e:
              print(f"Warning: Could not parse pip-audit report: {e}")

          # --- Parse npm audit results ---
          npm_report_path = "src/frontend/npm-audit-report.json"
          try:
              with open(npm_report_path) as f:
                  npm_data = json.load(f)
              # npm audit JSON format v2
              vulns = npm_data.get("vulnerabilities", {})
              for pkg_name, info in vulns.items():
                  severity = info.get("severity", "low")
                  if severity in ("high", "critical"):
                      via = info.get("via", [])
                      vuln_ids = []
                      for v in via:
                          if isinstance(v, dict):
                              url = v.get("url", "")
                              if "GHSA" in url or "CVE" in url:
                                  vuln_ids.append(url.split("/")[-1])
                      findings.append({
                          "ecosystem": "npm",
                          "package": pkg_name,
                          "version": info.get("range", "unknown"),
                          "vuln_id": ", ".join(vuln_ids) if vuln_ids else "See npm audit",
                          "severity": severity,
                          "fix": info.get("fixAvailable", {}).get("version", "See npm audit") if isinstance(info.get("fixAvailable"), dict) else "See npm audit",
                      })
          except (FileNotFoundError, json.JSONDecodeError) as e:
              print(f"Warning: Could not parse npm audit report: {e}")

          # Filter to high/critical only
          high_critical = [f for f in findings if f["severity"] in ("high", "critical")]

          if not high_critical:
              print("✓ No high/critical vulnerabilities found.")
              sys.exit(0)

          print(f"⚠ Found {len(high_critical)} high/critical vulnerability finding(s).")

          # --- Check existing issues from last 7 days ---
          seven_days_ago = (datetime.now(timezone.utc) - timedelta(days=7)).strftime("%Y-%m-%d")
          try:
              result = subprocess.run(
                  ["gh", "issue", "list", "--state", "open", "--label", "security,vulnerability",
                   "--search", f"created:>={seven_days_ago}", "--json", "title", "--limit", "100"],
                  capture_output=True, text=True, timeout=30
              )
              existing_issues = []
              if result.returncode == 0:
                  existing_issues = [i["title"] for i in json.loads(result.stdout)]
          except (subprocess.TimeoutExpired, FileNotFoundError):
              existing_issues = []

          # --- Create issues for new vulnerabilities ---
          for finding in high_critical:
              issue_title = f"[{finding['severity'].upper()}] Vulnerability in {finding['package']} ({finding['ecosystem']})"

              # Skip if a similar issue already exists
              if any(finding["package"] in title for title in existing_issues):
                  print(f"  Skipping (existing issue): {issue_title}")
                  continue

              issue_body = f"""## Vulnerability Report (Nightly Scan)

          **Package:** {finding['package']}
          **Current Version:** {finding['version']}
          **Ecosystem:** {finding['ecosystem']}
          **Severity:** {finding['severity'].upper()}
          **Vulnerability ID:** {finding['vuln_id']}
          **Suggested Fix:** {finding['fix']}

          ---
          *Auto-created by nightly vulnerability scan on {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}*
          """

              try:
                  result = subprocess.run(
                      ["gh", "issue", "create",
                       "--title", issue_title,
                       "--body", issue_body,
                       "--label", "security,vulnerability"],
                      capture_output=True, text=True, timeout=30
                  )
                  if result.returncode == 0:
                      print(f"  Created issue: {issue_title}")
                  else:
                      print(f"  Failed to create issue: {result.stderr}")
              except (subprocess.TimeoutExpired, FileNotFoundError) as e:
                  print(f"  Could not create issue (gh CLI unavailable): {e}")

          SCRIPT

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-audit-reports
          path: |
            src/backend/pip-audit-report.json
            src/frontend/npm-audit-report.json
          retention-days: 30

  # ========================================
  # Test Report Summary
  # ========================================
  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [backend-full-tests, frontend-full-tests, e2e-full-tests, performance-tests, dependency-audit]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Nightly Test Results :crescent_moon:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Full Tests | ${{ needs.backend-full-tests.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Full Tests | ${{ needs.frontend-full-tests.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Full Tests | ${{ needs.e2e-full-tests.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | ${{ needs.performance-tests.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any critical job failed
        if: |
          needs.backend-full-tests.result == 'failure' ||
          needs.frontend-full-tests.result == 'failure' ||
          needs.e2e-full-tests.result == 'failure'
        run: exit 1
