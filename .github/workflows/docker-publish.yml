name: Docker - Release Artifact (D6 artifact-only)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry-run artifact build only; it never logs in or publishes an image.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release-artifact:
    name: Verify tag provenance and build release metadata
    runs-on: ubuntu-latest
    # D6 permits artifact builds only. The protected environment represents the
    # future release boundary; this job deliberately receives no credentials.
    environment: release

    steps:
      - name: Checkout complete release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify immutable release provenance
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::error::workflow_dispatch is dry-run only."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Release artifact builds must run from a protected version tag."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'."
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          MASTER_COMMIT="$(git rev-parse origin/master)"
          if [ "$TAG_COMMIT" != "$MASTER_COMMIT" ]; then
            echo "::error::Tag $TAG resolves to $TAG_COMMIT, not origin/master $MASTER_COMMIT."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "commit_sha=$TAG_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Build non-published backend artifact
        shell: bash
        run: |
          set -euo pipefail
          docker build --file src/backend/Dockerfile --tag "release-artifact/backend:${{ steps.release.outputs.tag }}" .

      - name: Build non-published frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          docker build --file src/frontend/Dockerfile --tag "release-artifact/frontend:${{ steps.release.outputs.tag }}" src/frontend

      - name: Write immutable release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          BACKEND_DIGEST="$(docker image inspect --format '{{.Id}}' "release-artifact/backend:${{ steps.release.outputs.tag }}")"
          FRONTEND_DIGEST="$(docker image inspect --format '{{.Id}}' "release-artifact/frontend:${{ steps.release.outputs.tag }}")"
          jq -n \
            --arg tag "${{ steps.release.outputs.tag }}" \
            --arg commit_sha "${{ steps.release.outputs.commit_sha }}" \
            --arg backend_digest "$BACKEND_DIGEST" \
            --arg frontend_digest "$FRONTEND_DIGEST" \
            --arg mode "artifact-only-d6" \
            '{tag: $tag, commit_sha: $commit_sha, backend_digest: $backend_digest, frontend_digest: $frontend_digest, mode: $mode}' \
            > release-metadata/release-metadata.json
          {
            echo "## Release artifact metadata"
            echo "- Tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Commit: \`${{ steps.release.outputs.commit_sha }}\`"
            echo "- Backend immutable digest: \`$BACKEND_DIGEST\`"
            echo "- Frontend immutable digest: \`$FRONTEND_DIGEST\`"
            echo "- D6 status: artifact-only; no registry login or image publishing occurred."
            echo "- A protected release manager must attach this metadata to an approved GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ steps.release.outputs.tag }}
          path: release-metadata/release-metadata.json
          if-no-files-found: error
          retention-days: 30
