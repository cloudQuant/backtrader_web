- id: futures-t-tf-spread-daily
  name: T/TF期限价差套利投研方案
  description: T0_TF0_SPREAD 为 100 + 10 * (T0 - TF0) 的本地价差指数，用于不同期限国债期货价差均值回归投研。
  config:
    prompt: '请为不同期限国债期货套利指数 T0_TF0_SPREAD 生成一套 1d 级别的可执行 Backtrader 策略，并自动迭代回测直到达到质量门槛。


      标的说明：

      1. T0_TF0_SPREAD 是本地构造的正值价差指数，口径为 100 + 10 * (T0 - TF0)。

      2. 策略应按价差指数做均值回归或突破失效后的反转逻辑，不要当作普通股票趋势策略处理。

      3. 重点比较滚动 z-score、均线偏离、波动率过滤、趋势过滤和风险预算。


      输出要求：

      1. 生成完整可运行的 Backtrader Strategy 脚本，next 方法必须包含真实 self.buy/self.sell/self.close
      或 order_target_* 调用。

      2. 禁止 pass、TODO、伪代码和依赖外部不可用数据。

      3. 必须包含入场、出场、止损/止盈、仓位 sizing、异常行情保护和最小交易间隔。

      4. 每轮改进都说明为什么可能改善 Sharpe、回撤、交易次数或实盘可执行性。

      '
